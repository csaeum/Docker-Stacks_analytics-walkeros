# nginx.conf - walkerOS walker.js - START
# IDs per website come with the request: walker.js?ga4=G-...&meta=<pixel>&pinterest=<tag> (set by the Sulu bundle per webspace).
# Only values of the expected shape get through, everything else keeps the placeholder (target stays off).
map $arg_ga4 $ga4_id {
    default "G-XXXXXXXXXX";
    "~^G-[A-Z0-9]{4,20}$" $arg_ga4;
}
map $arg_meta $meta_id {
    default "9990000000001";
    "~^[0-9]{5,20}$" $arg_meta;
}

map $arg_pinterest $pinterest_id {
    default "9990000000002";
    "~^[0-9]{6,20}$" $arg_pinterest;
}

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/javascript;

    location = /walker.js {
        default_type text/javascript;
        types { }

        # Traefik only forwards allowed hosts, so $host is one of our collector hosts.
        sub_filter 'https://collector-host.invalid/collect' 'http://localhost:18080/collect';
        sub_filter 'G-XXXXXXXXXX' '$ga4_id';
        sub_filter '9990000000001' '$meta_id';
        sub_filter '9990000000002' '$pinterest_id';
        sub_filter_once off;
        sub_filter_types text/javascript;

        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
# nginx.conf - walkerOS walker.js - ENDE
