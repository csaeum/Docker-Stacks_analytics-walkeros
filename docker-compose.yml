# docker-compose.yaml - walkerOS - START
services:
  walkeros:
    build:
      context: .
      args:
        WALKEROS_VERSION: ${WALKEROS_VERSION}
    image: ${COMPOSE_PROJECT_NAME}-flow:${WALKEROS_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-walkerOS
    environment:
      TZ: ${TIMEZONE}
      # Real values only in .env.local on the server; empty means nothing is sent to Matomo
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_TOKEN_AUTH: ${MATOMO_TOKEN_AUTH:-}
      # Website whose events go to Matomo (site 12); other origins are dropped by the matomoSites transformer
      MATOMO_ORIGIN: ${MATOMO_ORIGIN:-https://web-seo-consulting.eu}
      # Server-side Meta Conversions API (account 1). Tokens only in .env.local; without ORIGIN, PIXEL_ID and ACCESS_TOKEN nothing is sent.
      # ORIGIN: websites of this account, comma-separated (Origin header). Another account = copy the block in flow.json and use _2.
      META_1_ORIGIN: ${META_1_ORIGIN:-}
      META_1_PIXEL_ID: ${META_1_PIXEL_ID:-}
      META_1_ACCESS_TOKEN: ${META_1_ACCESS_TOKEN:-}
      META_1_TEST_EVENT_CODE: ${META_1_TEST_EVENT_CODE:-}
      # Server-side Pinterest Conversions API (account 1). PINTEREST_1_TEST=true sends to the test endpoint (nothing is recorded).
      PINTEREST_1_ORIGIN: ${PINTEREST_1_ORIGIN:-}
      PINTEREST_1_AD_ACCOUNT_ID: ${PINTEREST_1_AD_ACCOUNT_ID:-}
      PINTEREST_1_ACCESS_TOKEN: ${PINTEREST_1_ACCESS_TOKEN:-}
      PINTEREST_1_TEST: ${PINTEREST_1_TEST:-}
      # Purchase path (POST /purchase): token of the shop that sends the server-side order complete (Bearer).
      # Only in .env.local; empty means the path answers 503 and nothing is sent.
      PURCHASE_TOKEN: ${PURCHASE_TOKEN:-}
    labels:
      - autoheal=true
      - autoheal.stop.timeout=10
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      # HTTP Router
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.rule=${HOSTRULE}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.entrypoints=web-http
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.middlewares=redirect-to-https@file
      # HTTPS Router
      # Only browser requests from allowed origins reach the collector. No Origin header means no match.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=(${HOSTRULE}) && Path(`/collect`) && (Method(`POST`) || Method(`OPTIONS`)) && HeaderRegexp(`Origin`, `${ALLOWED_ORIGIN_REGEX}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure-https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsEncrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=${COMPOSE_PROJECT_NAME}-ratelimit
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-ratelimit.ratelimit.average=${RATE_LIMIT_AVERAGE}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-ratelimit.ratelimit.burst=${RATE_LIMIT_BURST}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadBalancer.server.port=8080
      # Purchase router: server to server from the shop, so no Origin check. The bearer token is checked in the flow (purchaseAuth).
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-purchase.rule=(${HOSTRULE}) && Path(`/purchase`) && Method(`POST`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-purchase.entrypoints=websecure-https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-purchase.tls.certresolver=letsEncrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-purchase.middlewares=${COMPOSE_PROJECT_NAME}-ratelimit
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-purchase.service=${COMPOSE_PROJECT_NAME}-purchase
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-purchase.loadBalancer.server.port=8080
    networks:
      - traefik_proxy_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  walker:
    build:
      context: ./web
      args:
        WALKEROS_VERSION: ${WALKEROS_VERSION}
    image: ${COMPOSE_PROJECT_NAME}-walker:${WALKEROS_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-walker
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - autoheal=true
      - autoheal.stop.timeout=10
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      # Script tags send no reliable Origin, so this route checks host, path and method only.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-walker.rule=(${HOSTRULE}) && Path(`/walker.js`) && Method(`GET`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-walker.entrypoints=websecure-https
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-walker.tls.certresolver=letsEncrypt
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-walker.middlewares=${COMPOSE_PROJECT_NAME}-ratelimit
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}-walker.service=${COMPOSE_PROJECT_NAME}-walker
      - traefik.http.services.${COMPOSE_PROJECT_NAME}-walker.loadBalancer.server.port=8080
    networks:
      - traefik_proxy_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy_network:
    external: true
    name: ${PROXY_NETWORK}
# docker-compose.yaml - walkerOS - ENDE
